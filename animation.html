<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>✨ 星空粒子</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    overflow: hidden;
    background: #000;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }
  canvas { display: block; position: fixed; top: 0; left: 0; z-index: 0; }
  .overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 1; pointer-events: none;
  }
  .title {
    font-size: clamp(28px, 8vw, 72px);
    font-weight: 900;
    background: linear-gradient(135deg, #00f5ff, #ff00e6, #ffe600, #00ff88);
    background-size: 400% 400%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: gradient-shift 4s ease infinite, float-up 1.5s ease-out forwards;
    opacity: 0;
    text-align: center;
    letter-spacing: 4px;
  }
  .subtitle {
    font-size: clamp(14px, 3vw, 24px);
    color: rgba(255,255,255,0.6);
    margin-top: 16px;
    animation: float-up 1.5s ease-out 0.5s forwards;
    opacity: 0;
    letter-spacing: 8px;
  }
  .hint {
    position: fixed; bottom: 40px; left: 0; width: 100%; text-align: center;
    font-size: clamp(12px, 2.5vw, 16px);
    color: rgba(255,255,255,0.3);
    animation: float-up 1.5s ease-out 1s forwards, pulse 2s ease-in-out 2.5s infinite;
    opacity: 0;
    z-index: 1; pointer-events: none;
  }
  .back {
    position: fixed; top: 16px; left: 16px; z-index: 2;
    color: rgba(255,255,255,0.4); text-decoration: none;
    font-size: 14px; padding: 8px 16px;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 20px;
    transition: all 0.3s;
    animation: float-up 1.5s ease-out 1.2s forwards;
    opacity: 0;
  }
  .back:hover { color: #fff; border-color: rgba(255,255,255,0.3); }
  @keyframes gradient-shift { 0%,100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
  @keyframes float-up { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes pulse { 0%,100% { opacity: 0.3; } 50% { opacity: 0.6; } }
</style>
</head>
<body>
<a href="index.html" class="back">← 返回</a>
<canvas id="c"></canvas>
<div class="overlay">
  <div class="title">触碰星空</div>
  <div class="subtitle">✦ INTERACTIVE PARTICLES ✦</div>
</div>
<div class="hint">👆 触摸或移动鼠标与粒子互动</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, particles = [], mouse = { x: -9999, y: -9999, active: false };
const COLORS = ['#00f5ff','#ff00e6','#ffe600','#00ff88','#ff6b6b','#a855f7','#3b82f6'];
const isMobile = /Mobi|Android|iPhone/i.test(navigator.userAgent);
const COUNT = isMobile ? 120 : 300;

function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
window.addEventListener('resize', resize); resize();

class Particle {
  constructor() { this.reset(); }
  reset() {
    this.x = Math.random() * W; this.y = Math.random() * H;
    this.size = Math.random() * 2.5 + 0.5;
    this.speedX = (Math.random() - 0.5) * 0.8;
    this.speedY = (Math.random() - 0.5) * 0.8;
    this.color = COLORS[Math.floor(Math.random() * COLORS.length)];
    this.alpha = Math.random() * 0.6 + 0.4;
    this.pulse = Math.random() * Math.PI * 2;
    this.pulseSpeed = Math.random() * 0.02 + 0.01;
  }
  update() {
    this.pulse += this.pulseSpeed;
    const glow = Math.sin(this.pulse) * 0.3 + 0.7;
    if (mouse.active) {
      const dx = this.x - mouse.x, dy = this.y - mouse.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      const radius = isMobile ? 150 : 200;
      if (dist < radius) {
        const force = (radius - dist) / radius;
        const angle = Math.atan2(dy, dx);
        this.speedX += Math.cos(angle) * force * 0.8;
        this.speedY += Math.sin(angle) * force * 0.8;
        this.alpha = Math.min(1, this.alpha + 0.05);
      }
    }
    this.speedX *= 0.98; this.speedY *= 0.98;
    this.x += this.speedX; this.y += this.speedY;
    if (this.x < -10) this.x = W + 10; if (this.x > W + 10) this.x = -10;
    if (this.y < -10) this.y = H + 10; if (this.y > H + 10) this.y = -10;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size * glow, 0, Math.PI * 2);
    ctx.fillStyle = this.color;
    ctx.globalAlpha = this.alpha * glow;
    ctx.shadowColor = this.color; ctx.shadowBlur = 12;
    ctx.fill(); ctx.shadowBlur = 0; ctx.globalAlpha = 1;
  }
}
for (let i = 0; i < COUNT; i++) particles.push(new Particle());

function drawLines() {
  const maxDist = isMobile ? 80 : 120;
  for (let i = 0; i < particles.length; i++) {
    for (let j = i + 1; j < particles.length; j++) {
      const dx = particles[i].x - particles[j].x, dy = particles[i].y - particles[j].y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < maxDist) {
        ctx.beginPath();
        ctx.moveTo(particles[i].x, particles[i].y);
        ctx.lineTo(particles[j].x, particles[j].y);
        ctx.strokeStyle = `rgba(255,255,255,${(1 - dist / maxDist) * 0.15})`;
        ctx.lineWidth = 0.5; ctx.stroke();
      }
    }
  }
}

function drawMouseGlow() {
  if (!mouse.active) return;
  const g = ctx.createRadialGradient(mouse.x, mouse.y, 0, mouse.x, mouse.y, 150);
  g.addColorStop(0, 'rgba(0,245,255,0.08)');
  g.addColorStop(0.5, 'rgba(168,85,247,0.04)');
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.beginPath(); ctx.arc(mouse.x, mouse.y, 150, 0, Math.PI * 2);
  ctx.fillStyle = g; ctx.fill();
}

let shootingStars = [];
class ShootingStar {
  constructor() {
    this.x = Math.random() * W; this.y = 0;
    this.len = Math.random() * 80 + 40;
    this.speed = Math.random() * 8 + 6;
    this.angle = Math.PI / 4 + (Math.random() - 0.5) * 0.3;
    this.alpha = 1;
    this.color = COLORS[Math.floor(Math.random() * COLORS.length)];
  }
  update() {
    this.x += Math.cos(this.angle) * this.speed;
    this.y += Math.sin(this.angle) * this.speed;
    this.alpha -= 0.012;
    ctx.beginPath(); ctx.moveTo(this.x, this.y);
    ctx.lineTo(this.x - Math.cos(this.angle) * this.len, this.y - Math.sin(this.angle) * this.len);
    const grad = ctx.createLinearGradient(this.x, this.y,
      this.x - Math.cos(this.angle) * this.len, this.y - Math.sin(this.angle) * this.len);
    grad.addColorStop(0, this.color); grad.addColorStop(1, 'transparent');
    ctx.strokeStyle = grad; ctx.globalAlpha = this.alpha;
    ctx.lineWidth = 2; ctx.stroke(); ctx.globalAlpha = 1;
  }
}

function animate() {
  ctx.fillStyle = 'rgba(0,0,0,0.15)'; ctx.fillRect(0, 0, W, H);
  drawMouseGlow(); drawLines();
  particles.forEach(p => p.update());
  if (Math.random() < 0.008) shootingStars.push(new ShootingStar());
  shootingStars = shootingStars.filter(s => s.alpha > 0);
  shootingStars.forEach(s => s.update());
  requestAnimationFrame(animate);
}
animate();

window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; mouse.active = true; });
window.addEventListener('mouseleave', () => { mouse.active = false; });
window.addEventListener('touchstart', e => { const t = e.touches[0]; mouse.x = t.clientX; mouse.y = t.clientY; mouse.active = true; }, { passive: true });
window.addEventListener('touchmove', e => { const t = e.touches[0]; mouse.x = t.clientX; mouse.y = t.clientY; }, { passive: true });
window.addEventListener('touchend', () => { mouse.active = false; });
</script>
</body>
</html>
