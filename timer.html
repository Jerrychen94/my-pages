<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🍅 番茄钟</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
    color: #fff;
    display: flex; flex-direction: column; align-items: center;
    padding: 20px;
    overflow-x: hidden;
  }
  .header {
    display: flex; align-items: center; justify-content: space-between;
    width: 100%; max-width: 500px;
    margin-bottom: 24px;
  }
  .back {
    color: rgba(255,255,255,0.5); text-decoration: none;
    font-size: 14px; padding: 6px 14px;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 16px; transition: all 0.3s;
  }
  .back:hover { color: #fff; border-color: rgba(255,255,255,0.3); }
  .session-count {
    font-size: 13px; color: rgba(255,255,255,0.4);
    padding: 6px 14px;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 16px;
  }
  .session-count span { color: #00ff88; font-weight: 700; }

  .container {
    width: 100%; max-width: 500px;
    text-align: center;
    animation: fadeIn 1s ease-out;
  }
  h1 {
    font-size: clamp(24px, 6vw, 40px);
    margin-bottom: 8px;
    background: linear-gradient(135deg, #00f5ff, #a855f7, #ff00e6);
    background-size: 300% 300%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: gradient 4s ease infinite;
  }
  .desc {
    color: rgba(255,255,255,0.5);
    font-size: 14px;
    margin-bottom: 32px;
    letter-spacing: 4px;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes gradient { 0%,100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }

  .bg-orb {
    position: fixed; border-radius: 50%; filter: blur(80px); opacity: 0.15; pointer-events: none; z-index: -1;
  }
  .bg-orb:nth-child(1) { width: 300px; height: 300px; background: #a855f7; top: -100px; left: -100px; animation: drift1 8s ease-in-out infinite; }
  .bg-orb:nth-child(2) { width: 250px; height: 250px; background: #00f5ff; bottom: -80px; right: -80px; animation: drift2 10s ease-in-out infinite; }
  @keyframes drift1 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(40px,30px); } }
  @keyframes drift2 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-30px,-40px); } }

  /* ===== 模式切换 ===== */
  .modes {
    display: flex; gap: 8px;
    justify-content: center;
    margin-bottom: 32px;
    flex-wrap: wrap;
  }
  .mode-btn {
    padding: 8px 18px;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 16px;
    background: rgba(255,255,255,0.05);
    color: rgba(255,255,255,0.5);
    font-size: 13px;
    cursor: pointer; transition: all 0.3s;
  }
  .mode-btn:hover { background: rgba(255,255,255,0.1); color: #fff; }
  .mode-btn:active { transform: scale(0.97); }
  .mode-btn.active {
    background: rgba(255,255,255,0.12);
    border-color: rgba(255,255,255,0.25);
    color: #fff;
  }
  .mode-btn.active.focus { border-color: rgba(255,107,107,0.4); color: #ff6b6b; }
  .mode-btn.active.short { border-color: rgba(0,255,136,0.4); color: #00ff88; }
  .mode-btn.active.long { border-color: rgba(0,245,255,0.4); color: #00f5ff; }

  /* ===== 计时器圆环 ===== */
  .timer-wrap {
    position: relative;
    width: clamp(240px, 70vw, 320px);
    height: clamp(240px, 70vw, 320px);
    margin: 0 auto 40px;
  }
  .timer-ring {
    width: 100%; height: 100%;
    transform: rotate(-90deg);
  }
  .ring-bg {
    fill: none;
    stroke: rgba(255,255,255,0.06);
    stroke-width: 8;
  }
  .ring-progress {
    fill: none;
    stroke: url(#grad);
    stroke-width: 8;
    stroke-linecap: round;
    transition: stroke-dashoffset 0.5s linear, stroke 0.5s ease;
  }
  .timer-text {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }
  .timer-time {
    font-size: clamp(40px, 12vw, 64px);
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    background: linear-gradient(135deg, #00f5ff, #a855f7);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: 2px;
  }
  .timer-label {
    font-size: 13px;
    color: rgba(255,255,255,0.3);
    margin-top: 4px;
    letter-spacing: 3px;
    text-transform: uppercase;
  }

  /* ===== 控制按钮 ===== */
  .controls {
    display: flex; gap: 16px;
    justify-content: center;
    margin-bottom: 24px;
  }
  .ctrl-btn {
    padding: 14px 32px;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 14px;
    background: rgba(255,255,255,0.05);
    color: #fff; font-size: 16px;
    cursor: pointer; transition: all 0.3s;
    display: flex; align-items: center; gap: 8px;
    min-width: 110px;
    justify-content: center;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }
  .ctrl-btn:hover { background: rgba(255,255,255,0.1); }
  .ctrl-btn:active { transform: scale(0.97); }
  .ctrl-btn.primary {
    background: linear-gradient(135deg, rgba(0,245,255,0.15), rgba(168,85,247,0.15));
    border-color: rgba(168,85,247,0.3);
  }
  .ctrl-btn.primary:hover {
    background: linear-gradient(135deg, rgba(0,245,255,0.25), rgba(168,85,247,0.25));
    border-color: rgba(168,85,247,0.5);
  }
  .ctrl-btn:disabled {
    opacity: 0.3; cursor: not-allowed;
  }
  .ctrl-btn:disabled:hover { background: rgba(255,255,255,0.05); }

  /* ===== 番茄进度点 ===== */
  .pomodoro-dots {
    display: flex; gap: 10px;
    justify-content: center;
    margin-top: 8px;
  }
  .dot {
    width: 12px; height: 12px;
    border-radius: 50%;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.1);
    transition: all 0.3s;
  }
  .dot.filled {
    background: linear-gradient(135deg, #ff6b6b, #ff00e6);
    border-color: rgba(255,107,107,0.4);
    box-shadow: 0 0 12px rgba(255,107,107,0.4);
  }

  /* ===== 完成提示 ===== */
  .toast {
    position: fixed; top: 20px; left: 50%;
    transform: translateX(-50%) translateY(-100px);
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 14px;
    padding: 14px 24px;
    color: #fff; font-size: 15px;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    z-index: 100;
    transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    white-space: nowrap;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  /* ===== 设置 ===== */
  .settings-toggle {
    position: fixed; bottom: 20px; right: 20px;
    width: 44px; height: 44px;
    border-radius: 50%;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    color: rgba(255,255,255,0.5);
    font-size: 20px;
    cursor: pointer; transition: all 0.3s;
    display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    z-index: 50;
  }
  .settings-toggle:hover { background: rgba(255,255,255,0.12); color: #fff; }

  .settings-panel {
    position: fixed; bottom: 76px; right: 20px;
    width: 260px;
    background: rgba(30,28,60,0.85);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 16px;
    padding: 20px;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    z-index: 50;
    opacity: 0; pointer-events: none;
    transform: translateY(10px);
    transition: all 0.3s;
  }
  .settings-panel.open { opacity: 1; pointer-events: auto; transform: translateY(0); }
  .settings-panel h3 {
    font-size: 14px; color: rgba(255,255,255,0.6);
    margin-bottom: 16px; letter-spacing: 2px;
  }
  .setting-row {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 14px;
  }
  .setting-row:last-child { margin-bottom: 0; }
  .setting-row label {
    font-size: 14px; color: rgba(255,255,255,0.7);
  }
  .setting-row input {
    width: 60px;
    padding: 6px 10px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px;
    color: #fff; font-size: 14px;
    text-align: center;
    -moz-appearance: textfield;
  }
  .setting-row input::-webkit-outer-spin-button,
  .setting-row input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .setting-row input:focus { outline: none; border-color: rgba(168,85,247,0.4); }

  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="bg-orb"></div>
<div class="bg-orb"></div>

<div class="toast" id="toast"></div>

<div class="header">
  <a href="index.html" class="back">← 返回</a>
  <div class="session-count">今日完成 <span id="sessionCount">0</span> 个番茄</div>
</div>

<div class="container">
  <h1>番茄钟</h1>
  <p class="desc">FOCUS · BREAK · REPEAT</p>

  <div class="modes">
    <button class="mode-btn focus active" onclick="switchMode('focus')">🎯 专注</button>
    <button class="mode-btn short" onclick="switchMode('short')">☕ 短休息</button>
    <button class="mode-btn long" onclick="switchMode('long')">🌙 长休息</button>
  </div>

  <div class="timer-wrap">
    <svg class="timer-ring" viewBox="0 0 300 300">
      <defs>
        <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#00f5ff"/>
          <stop offset="100%" stop-color="#a855f7"/>
        </linearGradient>
        <linearGradient id="grad-focus" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#ff6b6b"/>
          <stop offset="100%" stop-color="#ff00e6"/>
        </linearGradient>
        <linearGradient id="grad-short" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#00ff88"/>
          <stop offset="100%" stop-color="#3b82f6"/>
        </linearGradient>
        <linearGradient id="grad-long" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#00f5ff"/>
          <stop offset="100%" stop-color="#a855f7"/>
        </linearGradient>
      </defs>
      <circle class="ring-bg" cx="150" cy="150" r="140"/>
      <circle class="ring-progress" id="ringProgress" cx="150" cy="150" r="140"/>
    </svg>
    <div class="timer-text">
      <div class="timer-time" id="timerTime">25:00</div>
      <div class="timer-label" id="timerLabel">FOCUS</div>
    </div>
  </div>

  <div class="controls">
    <button class="ctrl-btn primary" id="startBtn" onclick="toggleTimer()">▶ 开始</button>
    <button class="ctrl-btn" id="resetBtn" onclick="resetTimer()">↻ 重置</button>
  </div>

  <div class="pomodoro-dots" id="pomodoroDots"></div>
</div>

<button class="settings-toggle" onclick="toggleSettings()">⚙</button>
<div class="settings-panel" id="settingsPanel">
  <h3>自定义时长（分钟）</h3>
  <div class="setting-row">
    <label>🎯 专注</label>
    <input type="number" id="setFocus" value="25" min="1" max="90">
  </div>
  <div class="setting-row">
    <label>☕ 短休息</label>
    <input type="number" id="setShort" value="5" min="1" max="30">
  </div>
  <div class="setting-row">
    <label>🌙 长休息</label>
    <input type="number" id="setLong" value="15" min="1" max="60">
  </div>
  <div class="setting-row">
    <label>🔄 长休息间隔</label>
    <input type="number" id="setInterval" value="4" min="2" max="8">
  </div>
</div>

<script>
const MODES = {
  focus: { label: 'FOCUS', gradId: 'grad-focus', color: '#ff6b6b' },
  short: { label: 'SHORT BREAK', gradId: 'grad-short', color: '#00ff88' },
  long:  { label: 'LONG BREAK', gradId: 'grad-long',  color: '#00f5ff' }
};

let durations = { focus: 25, short: 5, long: 15 };
let longBreakInterval = 4;

let currentMode = 'focus';
let timeLeft = durations.focus * 60;
let totalTime = durations.focus * 60;
let isRunning = false;
let timerInterval = null;
let sessionCount = 0;
let pomodoroCount = 0; // 当前周期内完成的专注数

const RING_CIRC = 2 * Math.PI * 140;
const ringEl = document.getElementById('ringProgress');
ringEl.style.strokeDasharray = RING_CIRC;
ringEl.style.strokeDashoffset = 0;

function formatTime(sec) {
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

function updateDisplay() {
  document.getElementById('timerTime').textContent = formatTime(timeLeft);
  document.getElementById('timerLabel').textContent = MODES[currentMode].label;
  const progress = totalTime > 0 ? timeLeft / totalTime : 0;
  ringEl.style.strokeDashoffset = RING_CIRC * (1 - progress);
  ringEl.setAttribute('stroke', `url(#${MODES[currentMode].gradId})`);
  // 更新页面标题
  document.title = `${formatTime(timeLeft)} — 🍅 番茄钟`;
}

function updateDots() {
  const container = document.getElementById('pomodoroDots');
  container.innerHTML = '';
  for (let i = 0; i < longBreakInterval; i++) {
    const dot = document.createElement('div');
    dot.className = 'dot' + (i < pomodoroCount ? ' filled' : '');
    container.appendChild(dot);
  }
}

function toggleTimer() {
  if (isRunning) {
    pauseTimer();
  } else {
    startTimer();
  }
}

function startTimer() {
  isRunning = true;
  document.getElementById('startBtn').textContent = '⏸ 暂停';
  timerInterval = setInterval(() => {
    timeLeft--;
    updateDisplay();
    if (timeLeft <= 0) {
      complete();
    }
  }, 1000);
}

function pauseTimer() {
  isRunning = false;
  document.getElementById('startBtn').textContent = '▶ 继续';
  clearInterval(timerInterval);
}

function resetTimer() {
  pauseTimer();
  document.getElementById('startBtn').textContent = '▶ 开始';
  timeLeft = durations[currentMode] * 60;
  totalTime = durations[currentMode] * 60;
  updateDisplay();
}

function complete() {
  pauseTimer();
  playChime();
  if (currentMode === 'focus') {
    sessionCount++;
    pomodoroCount++;
    document.getElementById('sessionCount').textContent = sessionCount;
    if (pomodoroCount >= longBreakInterval) {
      pomodoroCount = 0;
      showToast('🎉 专注完成！该长休息了');
      switchMode('long');
    } else {
      showToast('🍅 专注完成！短休息一下');
      switchMode('short');
    }
  } else {
    showToast('💪 休息结束，继续专注！');
    switchMode('focus');
  }
  updateDots();
  // 自动开始下一个
  startTimer();
}

function switchMode(mode) {
  const wasRunning = isRunning;
  pauseTimer();
  currentMode = mode;
  timeLeft = durations[mode] * 60;
  totalTime = durations[mode] * 60;
  // 更新模式按钮
  document.querySelectorAll('.mode-btn').forEach(btn => {
    btn.classList.remove('active');
    if (btn.classList.contains(mode)) btn.classList.add('active');
  });
  document.getElementById('startBtn').textContent = '▶ 开始';
  updateDisplay();
  if (wasRunning) startTimer();
}

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 3500);
}

function playChime() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const notes = [880, 1108, 1318]; // A5, C#6, E6
    notes.forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.frequency.value = freq;
      osc.type = 'sine';
      osc.connect(gain);
      gain.connect(ctx.destination);
      const t = ctx.currentTime + i * 0.15;
      gain.gain.setValueAtTime(0, t);
      gain.gain.linearRampToValueAtTime(0.3, t + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.8);
      osc.start(t);
      osc.stop(t + 0.8);
    });
  } catch(e) {}
}

function toggleSettings() {
  document.getElementById('settingsPanel').classList.toggle('open');
}

// 应用自定义时长
document.querySelectorAll('.setting-row input').forEach(input => {
  input.addEventListener('change', () => {
    const f = Math.max(1, parseInt(document.getElementById('setFocus').value) || 25);
    const s = Math.max(1, parseInt(document.getElementById('setShort').value) || 5);
    const l = Math.max(1, parseInt(document.getElementById('setLong').value) || 15);
    const iv = Math.max(2, parseInt(document.getElementById('setInterval').value) || 4);
    durations = { focus: f, short: s, long: l };
    longBreakInterval = iv;
    if (!isRunning) {
      timeLeft = durations[currentMode] * 60;
      totalTime = durations[currentMode] * 60;
      updateDisplay();
    }
    updateDots();
  });
});

// 键盘快捷键
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.code === 'Space') { e.preventDefault(); toggleTimer(); }
  if (e.code === 'KeyR') { resetTimer(); }
  if (e.code === 'Digit1') { switchMode('focus'); }
  if (e.code === 'Digit2') { switchMode('short'); }
  if (e.code === 'Digit3') { switchMode('long'); }
});

updateDisplay();
updateDots();
</script>
</body>
</html>
