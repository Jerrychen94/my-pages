<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>📖 单词复习</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
    color: #fff;
    display: flex; flex-direction: column; align-items: center;
    padding: 20px;
    overflow-x: hidden;
  }
  .header {
    display: flex; align-items: center; justify-content: space-between;
    width: 100%; max-width: 500px;
    margin-bottom: 24px;
  }
  .back {
    color: rgba(255,255,255,0.5); text-decoration: none;
    font-size: 14px; padding: 6px 14px;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 16px; transition: all 0.3s;
  }
  .back:hover { color: #fff; border-color: rgba(255,255,255,0.3); }
  .mode-toggle {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    color: #fff; padding: 6px 14px;
    border-radius: 16px; font-size: 13px;
    cursor: pointer; transition: all 0.3s;
  }
  .mode-toggle:hover { background: rgba(255,255,255,0.15); }

  .progress {
    width: 100%; max-width: 500px;
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 32px;
  }
  .progress-bar {
    flex: 1; height: 4px;
    background: rgba(255,255,255,0.1);
    border-radius: 2px; overflow: hidden;
  }
  .progress-fill {
    height: 100%; border-radius: 2px;
    background: linear-gradient(90deg, #00f5ff, #a855f7);
    transition: width 0.4s ease;
  }
  .progress-text { font-size: 13px; color: rgba(255,255,255,0.4); white-space: nowrap; }

  .card-scene {
    width: 100%; max-width: 500px;
    height: 320px;
    perspective: 1000px;
    margin-bottom: 32px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .card-inner {
    width: 100%; height: 100%;
    position: relative;
    transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    transform-style: preserve-3d;
  }
  .card-scene.flipped .card-inner { transform: rotateY(180deg); }
  .card-front, .card-back {
    position: absolute; width: 100%; height: 100%;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    border-radius: 20px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 32px;
    border: 1px solid rgba(255,255,255,0.1);
  }
  .card-front {
    background: linear-gradient(145deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02));
    backdrop-filter: blur(20px);
  }
  .card-back {
    background: linear-gradient(145deg, rgba(168,85,247,0.15), rgba(0,245,255,0.08));
    backdrop-filter: blur(20px);
    transform: rotateY(180deg);
  }
  .card-word {
    font-size: clamp(32px, 8vw, 48px);
    font-weight: 800;
    margin-bottom: 8px;
    background: linear-gradient(135deg, #00f5ff, #a855f7);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .card-phonetic {
    font-size: 16px; color: rgba(255,255,255,0.4);
    margin-bottom: 16px;
  }
  .card-pos {
    font-size: 12px; color: rgba(255,255,255,0.3);
    background: rgba(255,255,255,0.06);
    padding: 4px 12px; border-radius: 10px;
  }
  .card-meaning {
    font-size: clamp(22px, 5vw, 30px);
    font-weight: 700;
    margin-bottom: 16px;
    text-align: center;
  }
  .card-example {
    font-size: 14px;
    color: rgba(255,255,255,0.5);
    text-align: center;
    line-height: 1.6;
    font-style: italic;
  }
  .card-example-cn {
    font-size: 13px;
    color: rgba(255,255,255,0.35);
    text-align: center;
    margin-top: 8px;
    font-style: normal;
  }
  .tap-hint {
    font-size: 12px;
    color: rgba(255,255,255,0.2);
    margin-top: 20px;
  }

  .nav-buttons {
    display: flex; gap: 16px;
    width: 100%; max-width: 500px;
    margin-bottom: 24px;
  }
  .nav-btn {
    flex: 1; padding: 14px;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 14px;
    background: rgba(255,255,255,0.05);
    color: #fff; font-size: 16px;
    cursor: pointer; transition: all 0.3s;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .nav-btn:hover { background: rgba(255,255,255,0.1); }
  .nav-btn:active { transform: scale(0.97); }
  .nav-btn.know { border-color: rgba(0,255,136,0.3); }
  .nav-btn.know:hover { background: rgba(0,255,136,0.1); }
  .nav-btn.dunno { border-color: rgba(255,107,107,0.3); }
  .nav-btn.dunno:hover { background: rgba(255,107,107,0.1); }

  /* Quiz Mode */
  .quiz-options {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 12px;
    width: 100%; max-width: 500px;
  }
  .quiz-opt {
    padding: 16px;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 14px;
    background: rgba(255,255,255,0.05);
    color: #fff; font-size: 16px;
    cursor: pointer; transition: all 0.3s;
    text-align: center;
  }
  .quiz-opt:hover { background: rgba(255,255,255,0.1); }
  .quiz-opt:active { transform: scale(0.97); }
  .quiz-opt.correct {
    background: rgba(0,255,136,0.2) !important;
    border-color: rgba(0,255,136,0.5) !important;
  }
  .quiz-opt.wrong {
    background: rgba(255,107,107,0.2) !important;
    border-color: rgba(255,107,107,0.5) !important;
  }
  .quiz-question {
    font-size: clamp(28px, 7vw, 42px);
    font-weight: 800;
    margin: 40px 0 12px;
    background: linear-gradient(135deg, #00f5ff, #a855f7);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .quiz-prompt {
    font-size: 14px; color: rgba(255,255,255,0.4);
    margin-bottom: 32px;
  }
  .score {
    font-size: 14px; color: rgba(255,255,255,0.4);
    margin-top: 20px;
  }
  .score span { color: #00ff88; font-weight: 700; }

  .hidden { display: none !important; }

  /* Swipe animation */
  .card-scene.swipe-left { animation: swipeLeft 0.3s ease forwards; }
  .card-scene.swipe-right { animation: swipeRight 0.3s ease forwards; }
  @keyframes swipeLeft {
    to { transform: translateX(-120%) rotate(-15deg); opacity: 0; }
  }
  @keyframes swipeRight {
    to { transform: translateX(120%) rotate(15deg); opacity: 0; }
  }
  @keyframes slideIn {
    from { transform: translateX(0) scale(0.95); opacity: 0; }
    to { transform: translateX(0) scale(1); opacity: 1; }
  }
  .card-scene.slide-in { animation: slideIn 0.35s ease forwards; }
</style>
</head>
<body>

<div class="header">
  <a href="index.html" class="back">← 返回</a>
  <button class="mode-toggle" id="modeBtn" onclick="toggleMode()">🎯 自测模式</button>
</div>

<!-- Flashcard Mode -->
<div id="flashcardMode">
  <div class="progress">
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-text" id="progressText">1 / 10</div>
  </div>

  <div class="card-scene" id="cardScene" onclick="flipCard()">
    <div class="card-inner" id="cardInner">
      <div class="card-front">
        <div class="card-word" id="cardWord"></div>
        <div class="card-phonetic" id="cardPhonetic"></div>
        <div class="card-pos" id="cardPos"></div>
        <div class="tap-hint">👆 点击翻转</div>
      </div>
      <div class="card-back">
        <div class="card-meaning" id="cardMeaning"></div>
        <div class="card-example" id="cardExample"></div>
        <div class="card-example-cn" id="cardExampleCn"></div>
        <div class="tap-hint">👆 点击翻回</div>
      </div>
    </div>
  </div>

  <div class="nav-buttons">
    <button class="nav-btn dunno" onclick="nextCard(false)">😕 不认识</button>
    <button class="nav-btn know" onclick="nextCard(true)">😊 认识</button>
  </div>
  <div class="score" id="flashcardScore"></div>
</div>

<!-- Quiz Mode -->
<div id="quizMode" class="hidden" style="width:100%;max-width:500px;text-align:center;">
  <div class="progress">
    <div class="progress-bar"><div class="progress-fill" id="quizProgressFill"></div></div>
    <div class="progress-text" id="quizProgressText">1 / 10</div>
  </div>
  <div class="quiz-question" id="quizWord"></div>
  <div class="quiz-prompt">选择正确的中文含义</div>
  <div class="quiz-options" id="quizOptions"></div>
  <div class="score" id="quizScore"></div>
</div>

<script>
const WORDS = [
  { word: "ephemeral", phonetic: "/ɪˈfemərəl/", pos: "adj.", meaning: "短暂的；转瞬即逝的", example: "Fame is ephemeral in the modern world.", exampleCn: "在现代世界，名声是转瞬即逝的。" },
  { word: "resilient", phonetic: "/rɪˈzɪliənt/", pos: "adj.", meaning: "有韧性的；能恢复的", example: "Children are remarkably resilient.", exampleCn: "孩子们有着非凡的韧性。" },
  { word: "eloquent", phonetic: "/ˈeləkwənt/", pos: "adj.", meaning: "雄辩的；有说服力的", example: "She gave an eloquent speech.", exampleCn: "她发表了一篇雄辩的演讲。" },
  { word: "ubiquitous", phonetic: "/juːˈbɪkwɪtəs/", pos: "adj.", meaning: "无处不在的", example: "Smartphones have become ubiquitous.", exampleCn: "智能手机已经无处不在。" },
  { word: "pragmatic", phonetic: "/præɡˈmætɪk/", pos: "adj.", meaning: "务实的；实用的", example: "We need a pragmatic approach to this problem.", exampleCn: "我们需要对这个问题采取务实的态度。" },
  { word: "serendipity", phonetic: "/ˌserənˈdɪpəti/", pos: "n.", meaning: "意外发现美好事物的运气", example: "Finding that book was pure serendipity.", exampleCn: "找到那本书纯属机缘巧合。" },
  { word: "meticulous", phonetic: "/məˈtɪkjələs/", pos: "adj.", meaning: "一丝不苟的；细心的", example: "He is meticulous about his work.", exampleCn: "他对工作一丝不苟。" },
  { word: "paradigm", phonetic: "/ˈpærədaɪm/", pos: "n.", meaning: "范式；典范", example: "This represents a paradigm shift in education.", exampleCn: "这代表了教育领域的范式转变。" },
  { word: "ambiguous", phonetic: "/æmˈbɪɡjuəs/", pos: "adj.", meaning: "模糊的；有歧义的", example: "The instructions were ambiguous.", exampleCn: "这些指示含糊不清。" },
  { word: "contemplate", phonetic: "/ˈkɒntəmpleɪt/", pos: "v.", meaning: "沉思；深思熟虑", example: "She sat quietly, contemplating the view.", exampleCn: "她静静地坐着，凝视着风景。" }
];

let current = 0, known = 0, quizIndex = 0, quizCorrect = 0;
let isQuizMode = false;

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function showCard() {
  const w = WORDS[current];
  document.getElementById('cardWord').textContent = w.word;
  document.getElementById('cardPhonetic').textContent = w.phonetic;
  document.getElementById('cardPos').textContent = w.pos;
  document.getElementById('cardMeaning').textContent = w.meaning;
  document.getElementById('cardExample').textContent = `"${w.example}"`;
  document.getElementById('cardExampleCn').textContent = w.exampleCn;
  document.getElementById('progressFill').style.width = ((current + 1) / WORDS.length * 100) + '%';
  document.getElementById('progressText').textContent = `${current + 1} / ${WORDS.length}`;
  document.getElementById('cardScene').classList.remove('flipped');
  updateScore();
}

function flipCard() {
  document.getElementById('cardScene').classList.toggle('flipped');
}

function nextCard(isKnown) {
  if (isKnown) known++;
  const scene = document.getElementById('cardScene');
  scene.classList.add(isKnown ? 'swipe-right' : 'swipe-left');
  setTimeout(() => {
    scene.classList.remove('swipe-right', 'swipe-left', 'flipped');
    scene.classList.add('slide-in');
    current = (current + 1) % WORDS.length;
    showCard();
    setTimeout(() => scene.classList.remove('slide-in'), 350);
  }, 300);
}

function updateScore() {
  const el = document.getElementById('flashcardScore');
  if (current > 0) {
    el.textContent = `已复习 ${current} 个，认识 ${known} 个`;
  } else {
    el.textContent = '';
  }
}

function toggleMode() {
  isQuizMode = !isQuizMode;
  const btn = document.getElementById('modeBtn');
  if (isQuizMode) {
    btn.textContent = '📇 卡片模式';
    document.getElementById('flashcardMode').classList.add('hidden');
    document.getElementById('quizMode').classList.remove('hidden');
    quizIndex = 0; quizCorrect = 0;
    showQuiz();
  } else {
    btn.textContent = '🎯 自测模式';
    document.getElementById('quizMode').classList.add('hidden');
    document.getElementById('flashcardMode').classList.remove('hidden');
    current = 0; known = 0;
    showCard();
  }
}

let quizAnswer = 0;
function showQuiz() {
  const shuffled = shuffle(WORDS);
  const q = shuffled[0];
  const options = shuffle([q, ...shuffle(WORDS.filter(w => w.word !== q.word)).slice(0, 3)]);
  quizAnswer = options.findIndex(o => o.word === q.word);

  document.getElementById('quizWord').textContent = q.word;
  document.getElementById('quizProgressFill').style.width = ((quizIndex + 1) / WORDS.length * 100) + '%';
  document.getElementById('quizProgressText').textContent = `${quizIndex + 1} / ${WORDS.length}`;

  const container = document.getElementById('quizOptions');
  container.innerHTML = '';
  options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'quiz-opt';
    btn.textContent = opt.meaning;
    btn.onclick = () => checkAnswer(i, btn);
    container.appendChild(btn);
  });
  document.getElementById('quizScore').textContent = quizIndex > 0 ? `答对 <span>${quizCorrect}</span> / ${quizIndex} 题` : '';
}

function checkAnswer(idx, btn) {
  const allBtns = document.querySelectorAll('.quiz-opt');
  allBtns.forEach(b => b.onclick = null);
  if (idx === quizAnswer) {
    btn.classList.add('correct');
    quizCorrect++;
  } else {
    btn.classList.add('wrong');
    allBtns[quizAnswer].classList.add('correct');
  }
  setTimeout(() => {
    quizIndex++;
    if (quizIndex >= WORDS.length) {
      document.getElementById('quizWord').textContent = '🎉';
      document.getElementById('quizOptions').innerHTML = `<button class="quiz-opt" style="grid-column:span 2" onclick="quizIndex=0;quizCorrect=0;showQuiz()">再来一轮</button>`;
      document.getElementById('quizScore').textContent = `最终成绩：答对 ${quizCorrect} / ${WORDS.length} 题`;
      document.getElementById('quizProgressFill').style.width = '100%';
      document.getElementById('quizProgressText').textContent = '完成！';
    } else {
      showQuiz();
    }
  }, 800);
}

// Touch swipe support
let touchStartX = 0;
document.getElementById('cardScene').addEventListener('touchstart', e => {
  touchStartX = e.touches[0].clientX;
}, { passive: true });
document.getElementById('cardScene').addEventListener('touchend', e => {
  const diff = e.changedTouches[0].clientX - touchStartX;
  if (Math.abs(diff) > 60) {
    nextCard(diff > 0);
  }
});

showCard();
</script>
</body>
</html>
